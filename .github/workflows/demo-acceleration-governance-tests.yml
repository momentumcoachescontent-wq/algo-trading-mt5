name: Demo Acceleration Governance Tests

on:
  pull_request:
    paths:
      - "configs/demo_acceleration/*.json"
      - "python/governance/demo_acceleration_contract.py"
      - "python/pipeline/validate_demo_acceleration_contract.py"
      - "tests/test_demo_acceleration_contract.py"
      - "docs/adr/ADR-017-demo-acceleration-governance.md"
      - "docs/stage10/DEMO_ACCELERATION_PROGRAM_CHARTER.md"
      - "docs/stage10/README.md"
      - ".gitignore"
      - ".github/workflows/demo-acceleration-governance-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile governance modules
        run: |
          python -m py_compile \
            python/governance/demo_acceleration_contract.py \
            python/pipeline/validate_demo_acceleration_contract.py

      - name: Validate canonical contract
        run: |
          python python/pipeline/validate_demo_acceleration_contract.py \
            configs/demo_acceleration/demo_acceleration_v1.json

      - name: Run governance regression tests
        run: |
          python -m unittest tests.test_demo_acceleration_contract -v
